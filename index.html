<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastering JavaScript Fundamentals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>JavaScript Fundamentals Assignment</h1>



  <section id="part1">
    <h2>Part 1: Variables and Conditionals</h2>
    <input type="number" id="ageInput" placeholder="Enter your age">
    <button id="checkAgeBtn">Check Age</button>
    <p id="ageResult"></p>
  </section>

  
  <section id="part2">
    <h2>Part 2: Functions</h2>
    <button id="greetBtn">Greet Me</button>
    <p id="greetResult"></p>
    <button id="sumBtn">Sum 2 Numbers</button>
    <p id="sumResult"></p>
  </section>

  
  <section id="part3">
    <h2>Part 3: Loops</h2>
    <button id="loopBtn">Show Numbers 1-5</button>
    <p id="loopResult"></p>
  </section>

  
  <section id="part4">
    <h2>Part 4: DOM Manipulation</h2>
    <button id="toggleBtn">Toggle Background Color</button>
    <button id="addItemBtn">Add List Item</button>
    <ul id="itemList"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
